<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheetify</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"
        integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app_shell">
        <header class="app_header">
            <div class="brand">
                <span class="logo_dot"></span>
                <div class="brand_copy">
                    <span class="brand_name">Sheetify</span>
                    <span class="brand_tag">Lightweight grid playground</span>
                </div>
            </div>
            <div class="header_actions">
                <span class="pill">Ctrl + S to save</span>
            </div>
        </header>
        <main class="workspace">
            <div class="menu_bar">

                <div class="formatting-container">
                    <select class="font_family_input">
                        <option value="'Courier New'">Courier New</option>
                        <option value="'Franklin Gothic Medium'">Franklin Gothic Medium</option>
                        <option value="'Trebuchet MS'">Trebuchet MS</option>
                        <option value="Georgia">Georgia</option>
                    </select>
                    <select class="font_size_input">
                        <option value="14">14</option>
                        <option value="18">18</option>
                        <option value="20">20</option>
                        <option value="24">24</option>
                    </select>
                </div>
                <div class="bui_container">
                    <i class="fas fa-bold"></i>
                    <i class="fas fa-underline"></i>
                    <i class="fas fa-italic"></i>
                </div>
                <div class="alignment_container">
                    <i class="fas fa-align-right right"></i>
                    <i class="fas fa-align-center center"></i>
                    <i class="fas fa-align-justify justify"></i>
                    <i class="fas fa-align-left left"></i>
                </div>
                <div class="color-container">
                    <i class="fas fa-tint"></i>
                    <i class="fas fa-fill-drip"></i>
                    <input type="color" class="text_color" style="display: none">
                    <input type="color" class="background_color" style="display:none">
                </div>
            </div>
            <div class="formula_bar">
                <input type="text" class="address_input" disabled>
                <img src="funcicon.png" alt="">
                <input type="text" class="formula_input" placeholder="formula">
            </div>
            <div class="grid_container">
                <div class="top_left_cell">
                </div>
                <div class="top_row">
                    <!-- static -->
                </div>
                <div class="left_col">
                </div>
                <div class="grid">
                </div>
            </div>
            <div class="sheets_container">
                <div class="add-sheet_container">
                    <i class="fas fa-plus icon"></i>
                </div>
                <div class="sheets-list">
                    <div class="sheet active-sheet" sheetIdx="0"> Sheet 1</div>
                </div>
            </div>
        </main>
    </div>
    <script src="init.js"></script>
    <script src="menu.js"></script>
    <script src="formula.js"></script>
</body>
</html>
